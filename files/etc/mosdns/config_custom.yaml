cat > /etc/mosdns/config_custom.yaml << 'EOF'
log:
  level: error
  file: "/var/log/mosdns.log"

api:
  http: "0.0.0.0:9091"

plugins:
  - tag: stats_collector
    type: stats_api
    args:
      capacity: 3000
      dump_file: "/etc/mosdns/stats.dump"
      dump_interval: 300

  - tag: geosite_cn
    type: domain_set
    args:
      files:
        - "/var/mosdns/geosite_cn.txt"

  - tag: geosite_no_cn
    type: domain_set
    args:
      files:
        - "/var/mosdns/geosite_geolocation-!cn.txt"

  - tag: geoip_cn
    type: ip_set
    args:
      files:
        - "/var/mosdns/geoip_cn.txt"

  - tag: ads_extra
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rule/ads/anti-ad.txt"
        - "/etc/mosdns/rule/ads/adguard.txt"

  - tag: lazy_cache
    type: cache
    args:
      size: 32768
      lazy_cache_ttl: 86400
      dump_file: "/etc/mosdns/cache.dump"
      dump_interval: 600

  - tag: forward_local
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://dns.alidns.com/dns-query"
          bootstrap: 223.5.5.5
        - addr: "https://doh.pub/dns-query"
          bootstrap: 1.12.12.12
        - addr: 223.5.5.5
        - addr: 119.29.29.29

  - tag: forward_remote
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://dns.cloudflare.com/dns-query"
          bootstrap: 1.1.1.1
        - addr: "https://dns.google/dns-query"
          bootstrap: 8.8.8.8
        - addr: "tls://8.8.8.8"
        - addr: "tls://1.1.1.1"

  - tag: local_sequence
    type: sequence
    args:
      - exec: $forward_local
      - exec: ttl 300-86400

  - tag: remote_sequence
    type: sequence
    args:
      - exec: prefer_ipv4
      - exec: $forward_remote
      - exec: ttl 300-86400

  - tag: fallback_sequence
    type: sequence
    args:
      - exec: $forward_local
      - matches: "!resp_ip $geoip_cn"
        exec: drop_resp
      - matches: has_resp
        exec: accept
      - exec: $remote_sequence

  - tag: main_sequence
    type: sequence
    args:
      - exec: $stats_collector

      # 硬编码测试（确认匹配逻辑本身是否通）
      - matches: qname doubleclick.net
        exec: reject 3

      # 广告列表
      - matches: qname $ads_extra
        exec: reject 3

      - matches: qtype 65
        exec: reject 3

      - exec: $lazy_cache
      - matches: has_resp
        exec: accept

      - matches: qname $geosite_cn
        exec: $local_sequence

      - matches: qname $geosite_no_cn
        exec: $remote_sequence

      - exec: $fallback_sequence

  - type: udp_server
    args:
      entry: main_sequence
      listen: ":5335"

  - type: tcp_server
    args:
      entry: main_sequence
      listen: ":5335"
EOF
